<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 380" width="1600" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Manuel Guevara — Senior Software Engineer</title>
  <desc id="desc">Backend and data platforms. .NET, Go, Azure, Fintech. Buenos Aires.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0C1420"/>
      <stop offset="100%" stop-color="#121C2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="48%" r="32%">
      <stop offset="0%" stop-color="#C9A36A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A36A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#C9A36A" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A36A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A36A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C9A36A" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="380" fill="url(#bg)"/>
  <rect width="1600" height="380" fill="url(#grid)"/>
  <rect width="1600" height="380" fill="url(#glow)"/>
  <rect x="18" y="18" width="1564" height="344" fill="none" stroke="#C9A36A" stroke-opacity="0.38" stroke-width="1.25"/>
  <rect x="22" y="22" width="1556" height="336" fill="none" stroke="#C9A36A" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Identity -->
  <text x="64" y="78" fill="#C9A36A" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="7" font-weight="600">MAGCDEV</text>
  <text x="64" y="148" fill="#E7E1D4" font-family="Georgia, Times New Roman, Times, serif" font-size="58">Manuel Guevara</text>
  <text x="64" y="188" fill="#C9A36A" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="1.4" font-weight="600">Senior Software Engineer</text>
  <text x="64" y="222" fill="#9AA7B5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16">Backend &amp; data platforms · banking · energy · consulting</text>

  <!-- Copper rule that becomes the graph -->
  <path d="M64 248 H720" stroke="#C9A36A" stroke-width="1.5" fill="none" stroke-opacity="0.85"/>
  <circle cx="720" cy="248" r="2.5" fill="#C9A36A"/>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" letter-spacing="1.6" fill="#E7E1D4">
    <rect x="64" y="272" width="72" height="28" rx="2" fill="none" stroke="#C9A36A" stroke-opacity="0.55"/>
    <text x="80" y="291">.NET</text>
    <rect x="144" y="272" width="58" height="28" rx="2" fill="none" stroke="#C9A36A" stroke-opacity="0.55"/>
    <text x="160" y="291">Go</text>
    <rect x="210" y="272" width="78" height="28" rx="2" fill="none" stroke="#C9A36A" stroke-opacity="0.55"/>
    <text x="226" y="291">Azure</text>
    <rect x="296" y="272" width="86" height="28" rx="2" fill="none" stroke="#C9A36A" stroke-opacity="0.55"/>
    <text x="310" y="291">Fintech</text>
  </g>
  <text x="64" y="336" fill="#6B7C8D" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13">Buenos Aires  ·  8+ years in production  ·  open to Senior / Lead / Staff</text>

  <!-- Data-product constellation -->
  <g id="constellation" fill="none" stroke="#C9A36A" stroke-opacity="0.45" stroke-width="1.15">
    <path id="e1" d="M720 248 C860 248, 940 160, 1048 132"/>
    <path id="e2" d="M1048 132 L1168 96"/>
    <path id="e3" d="M1048 132 L1188 168"/>
    <path id="e4" d="M1188 168 L1312 214"/>
    <path id="e5" d="M1168 96 L1312 214"/>
    <path id="e6" d="M1312 214 L1456 148"/>
    <path id="e7" d="M1312 214 L1488 248"/>
    <path id="e8" d="M1312 214 L1408 312"/>
    <path id="e9" d="M1188 168 L1112 268"/>
    <path id="e10" d="M1112 268 L1408 312"/>
    <path id="orbit" d="M1048 132 C1188 90, 1360 140, 1312 214 C1260 290, 1120 300, 1112 268 C1098 210, 980 180, 1048 132"/>
  </g>

  <g fill="#C9A36A">
    <circle cx="1048" cy="132" r="4.5">
      <animate attributeName="r" values="4.5;6;4.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1168" cy="96" r="3.5"/>
    <circle cx="1188" cy="168" r="3.8"/>
    <circle cx="1312" cy="214" r="7">
      <animate attributeName="r" values="7;8.5;7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1456" cy="148" r="3.5"/>
    <circle cx="1488" cy="248" r="3.2"/>
    <circle cx="1408" cy="312" r="4"/>
    <circle cx="1112" cy="268" r="3.5"/>
  </g>

  <!-- Catalog node ring -->
  <circle cx="1312" cy="214" r="14" fill="none" stroke="#C9A36A" stroke-opacity="0.7" stroke-width="1.2">
    <animate attributeName="r" values="14;18;14" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0.15;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle r="3.2" fill="#E7E1D4">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbit"/>
    </animateMotion>
  </circle>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#9AA7B5" letter-spacing="1.2">
    <text x="1290" y="246">CATALOG</text>
    <text x="1008" y="118">PRODUCERS</text>
    <text x="1468" y="276">CONSUMERS</text>
  </g>
</svg>
