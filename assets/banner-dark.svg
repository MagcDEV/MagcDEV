<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Manuel Guevara — Senior Software Engineer</title>
  <desc id="desc">Backend and data platforms. .NET, Go, Azure, Fintech. Buenos Aires.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0C1420"/>
      <stop offset="100%" stop-color="#121C2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="48%" r="32%">
      <stop offset="0%" stop-color="#C9A36A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A36A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#C9A36A" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="440" fill="url(#bg)"/>
  <rect width="1600" height="440" fill="url(#grid)"/>
  <rect width="1600" height="440" fill="url(#glow)"/>
  <rect x="18" y="18" width="1564" height="404" fill="none" stroke="#C9A36A" stroke-opacity="0.38" stroke-width="1.25"/>
  <rect x="22" y="22" width="1556" height="396" fill="none" stroke="#C9A36A" stroke-opacity="0.12" stroke-width="1"/>

  <text x="64" y="82" fill="#C9A36A" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" letter-spacing="8" font-weight="600">MAGCDEV</text>
  <text x="64" y="160" fill="#E7E1D4" font-family="Georgia, Times New Roman, Times, serif" font-size="72">Manuel Guevara</text>
  <text x="64" y="210" fill="#C9A36A" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" letter-spacing="1.2" font-weight="600">Senior Software Engineer</text>
  <text x="64" y="250" fill="#9AA7B5" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20">Backend &amp; data platforms · banking · energy · consulting</text>

  <path d="M64 278 H720" stroke="#C9A36A" stroke-width="1.5" fill="none" stroke-opacity="0.85"/>
  <circle cx="720" cy="278" r="2.5" fill="#C9A36A"/>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" letter-spacing="1.4" fill="#E7E1D4">
    <rect x="64" y="304" width="96" height="38" rx="3" fill="none" stroke="#C9A36A" stroke-opacity="0.55"/>
    <text x="112" y="329" text-anchor="middle">.NET</text>
    <rect x="172" y="304" width="76" height="38" rx="3" fill="none" stroke="#C9A36A" stroke-opacity="0.55"/>
    <text x="210" y="329" text-anchor="middle">Go</text>
    <rect x="260" y="304" width="104" height="38" rx="3" fill="none" stroke="#C9A36A" stroke-opacity="0.55"/>
    <text x="312" y="329" text-anchor="middle">Azure</text>
    <rect x="376" y="304" width="118" height="38" rx="3" fill="none" stroke="#C9A36A" stroke-opacity="0.55"/>
    <text x="435" y="329" text-anchor="middle">Fintech</text>
  </g>
  <text x="64" y="384" fill="#6B7C8D" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17">Buenos Aires  ·  8+ years in production  ·  open to Senior / Lead / Staff</text>

  <g id="constellation" fill="none" stroke="#C9A36A" stroke-opacity="0.45" stroke-width="1.15">
    <path id="e1" d="M720 278 C860 278, 940 180, 1048 152"/>
    <path id="e2" d="M1048 152 L1168 116"/>
    <path id="e3" d="M1048 152 L1188 188"/>
    <path id="e4" d="M1188 188 L1312 234"/>
    <path id="e5" d="M1168 116 L1312 234"/>
    <path id="e6" d="M1312 234 L1456 168"/>
    <path id="e7" d="M1312 234 L1488 268"/>
    <path id="e8" d="M1312 234 L1408 332"/>
    <path id="e9" d="M1188 188 L1112 288"/>
    <path id="e10" d="M1112 288 L1408 332"/>
    <path id="orbit" d="M1048 152 C1188 110, 1360 160, 1312 234 C1260 310, 1120 320, 1112 288 C1098 230, 980 200, 1048 152"/>
  </g>

  <g fill="#C9A36A">
    <circle cx="1048" cy="152" r="4.5">
      <animate attributeName="r" values="4.5;6;4.5" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1168" cy="116" r="3.5"/>
    <circle cx="1188" cy="188" r="3.8"/>
    <circle cx="1312" cy="234" r="7">
      <animate attributeName="r" values="7;8.5;7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1456" cy="168" r="3.5"/>
    <circle cx="1488" cy="268" r="3.2"/>
    <circle cx="1408" cy="332" r="4"/>
    <circle cx="1112" cy="288" r="3.5"/>
  </g>

  <circle cx="1312" cy="234" r="14" fill="none" stroke="#C9A36A" stroke-opacity="0.7" stroke-width="1.2">
    <animate attributeName="r" values="14;18;14" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0.15;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle r="3.2" fill="#E7E1D4">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbit"/>
    </animateMotion>
  </circle>

  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#C9A36A" letter-spacing="1.6" font-weight="600">
    <text x="1312" y="272" text-anchor="middle">CATALOG</text>
    <text x="1048" y="132" text-anchor="middle">PRODUCERS</text>
    <text x="1488" y="298" text-anchor="middle">CONSUMERS</text>
  </g>
</svg>
